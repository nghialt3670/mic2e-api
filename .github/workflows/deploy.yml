name: Deploy API to Dev Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            cd ${{ secrets.DEV_SERVER_PATH }}
            cd mic2e-api
            
            git pull

            # Stop existing screen session if running
            screen -S mic2e-api -X quit || true

            # Start new screen session with conda env and API process
            screen -dmS mic2e-api bash -lc "
              source ~/.bashrc
              conda activate mic2e
              cd mic2e-api
              python run.py
            "

